    <svg class="nav-bloom nav-bloom-2" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg"><circle cx="14" cy="9" r="3.8" fill="#fff"/><circle cx="10" cy="13" r="3.2" fill="#fafdf6"/><circle cx="18" cy="13" r="3.2" fill="#fafdf6"/></svg>

    <svg class="nav-bloom nav-bloom-5" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="7" r="2.8" fill="#fff"/><circle cx="8" cy="11" r="2.3" fill="#fafdf6"/><circle cx="14" cy="11" r="2.3" fill="#fafdf6"/></svg>

    <svg class="nav-bloom nav-bloom-7" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="6.5" r="2.6" fill="#fff"/><circle cx="7.5" cy="10" r="2.2" fill="#fafdf6"/><circle cx="12.5" cy="10" r="2.2" fill="#fafdf6"/></svg>
    <svg class="nav-bloom nav-bloom-8" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg"><circle cx="13" cy="8" r="3.6" fill="#fffef9"/><circle cx="9" cy="13" r="3" fill="#fafdf6"/><circle cx="17" cy="13" r="3" fill="#fafdf6"/></svg>
    <svg class="nav-bloom nav-bloom-9" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="6" r="2.4" fill="#fff"/><circle cx="6.5" cy="9.5" r="2" fill="#fafdf6"/><circle cx="11.5" cy="9.5" r="2" fill="#fafdf6"/></svg>
  </div>
  <div class="navbar-brand gallery-brand">

      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" focusable="false">
        <circle cx="20" cy="11" r="5.2" fill="#fafdf6"/>
        <circle cx="13.5" cy="17" r="4.6" fill="#fffef9"/>
        <circle cx="26.5" cy="17" r="4.6" fill="#fffef9"/>
        <circle cx="17" cy="22.5" r="4" fill="#f6faf0"/>
        <circle cx="23" cy="22.5" r="4" fill="#f6faf0"/>
        <circle cx="20" cy="19" r="3.2" fill="#eef5e6"/>

</nav>

<div class="container-wide gallery-container">
  <div class="card gallery-intro-card" id="introCard">
    <div class="gallery-intro-bar">
      <p class="gallery-intro-line">槐花初绽，拾取花名与拥有者 · 数据随花坊维护同步</p>
    </div>
    <div id="loadStatus" class="ai-status loading" style="display:none;">
      <div class="spinner"></div><span>正在加载花坊数据…</span>
    </div>
    <div id="loadError" style="display:none;" class="ai-status error"></div>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="statFlowers">0</div>
        <div class="stat-label">花卉种类</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statMembers">0</div>
        <div class="stat-label">成员数</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statTotal">0</div>
        <div class="stat-label">总拥有记录</div>
      </div>
    </div>

    <div class="view-tabs" style="margin-bottom:20px;">
      <button type="button" class="view-tab active" id="tabByFlower" onclick="switchMode('flower')">🌸 按花搜人</button>
      <button type="button" class="view-tab" id="tabByMember" onclick="switchMode('member')">👤 按人搜花</button>
      <button type="button" class="view-tab" id="tabTable" onclick="switchMode('table')">📋 总表</button>
      <button type="button" class="view-tab" id="tabWorkshop" onclick="switchMode('workshop')">🏪 花坊兑换</button>
    </div>

    <div id="modeFlower" class="search-mode">
      <div class="card">
        <div class="card-title"><span class="icon">🔍</span> 花卉名称</div>
        <div class="form-group">
          <div class="input-with-clear">
            <input type="text" id="flowerSearchInput" class="form-input" placeholder="输入花名模糊筛选…" oninput="onFlowerInput()">
            <button type="button" id="flowerSearchClear" class="input-clear-btn" title="清空" onclick="clearFlowerSearch()" aria-label="清空">✕</button>
          </div>
        </div>
        <div id="flowerQuickPick"></div>
      </div>
      <div id="flowerResult"></div>
    </div>

    <div id="modeMember" class="search-mode" style="display:none;">
      <div class="card">
        <div class="card-title"><span class="icon">🔍</span> 成员（游戏 ID / 昵称）</div>
        <div class="form-group">
          <div class="input-with-clear">
            <input type="text" id="memberSearchInput" class="form-input" placeholder="输入游戏 ID 或昵称…" oninput="onMemberInput()">
            <button type="button" id="memberSearchClear" class="input-clear-btn" title="清空" onclick="clearMemberSearch()" aria-label="清空">✕</button>
          </div>
        </div>
        <div id="memberQuickPick"></div>
      </div>
      <div id="memberResult"></div>
    </div>

    <div id="modeTable" class="search-mode" style="display:none;">
      <div class="card">
        <div class="card-title"><span class="icon">📋</span> 成员花量统计（花少在上）</div>
        <div class="filter-bar">
          <div class="input-with-clear filter-bar-input-wrap">
            <input type="text" class="form-input" id="tableSearch" placeholder="筛选成员 ID / 昵称 / 花名…" oninput="onTableSearchInput()">
            <button type="button" id="tableSearchClear" class="input-clear-btn" title="清空" onclick="clearTableSearch()" aria-label="清空">✕</button>
          </div>
        </div>
        <div id="tableContent"></div>
      </div>
    </div>

    <div id="modeWorkshop" class="search-mode" style="display:none;">
      <div class="card">
        <div class="filter-bar" style="margin-bottom:0;">
          <div class="input-with-clear filter-bar-input-wrap">
            <input type="text" class="form-input" id="workshopTableSearch" placeholder="筛选图鉴花名 / 游戏 ID / 昵称…" oninput="onWorkshopTableSearchInput()">
            <button type="button" id="workshopTableSearchClear" class="input-clear-btn" title="清空" onclick="clearWorkshopTableSearch()" aria-label="清空">✕</button>
          </div>
        </div>
        <div id="workshopTableContent" style="margin-top:10px;"></div>
      </div>
    </div>
  </div>
</div>

<script src="app-gallery.js"></script>
<script>
  let galleryData = { flowers: {}, members: {}, workshopCatalog: [], workshopFlowers: {}, workshopFlowerImages: {}, flowerImages: {} };
  let currentMode = "flower";

  async function init() {
    document.getElementById("loadStatus").style.display = "flex";
    document.getElementById("loadError").style.display = "none";
    try {
      galleryData = await loadGalleryData();
    } catch (e) {
      document.getElementById("loadStatus").style.display = "none";
      const el = document.getElementById("loadError");
      el.style.display = "block";
      el.textContent = "✕ " + ((e && e.message) || String(e));
      return;
    }
    document.getElementById("loadStatus").style.display = "none";
    document.getElementById("mainContent").style.display = "block";

    const flowers = galleryData.flowers || {};
    const members = getAllMemberIds(galleryData);
    const total = Object.values(flowers).reduce((a, o) => a + (o || []).length, 0);
    document.getElementById("statFlowers").textContent = Object.keys(flowers).length;
    document.getElementById("statMembers").textContent = members.length;
    document.getElementById("statTotal").textContent = total;

    renderFlowerQuickPick();
    renderMemberQuickPick();
    renderTable();
    renderWorkshopTable();
    updateFlowerSearchClearBtn();
    updateMemberSearchClearBtn();
    updateWorkshopTableSearchClearBtn();
    updateTableSearchClearBtn();
  }

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById("tabByFlower").classList.toggle("active", mode === "flower");
    document.getElementById("tabByMember").classList.toggle("active", mode === "member");
    document.getElementById("tabTable").classList.toggle("active", mode === "table");
    document.getElementById("tabWorkshop").classList.toggle("active", mode === "workshop");
    document.getElementById("modeFlower").style.display = mode === "flower" ? "block" : "none";
    document.getElementById("modeMember").style.display = mode === "member" ? "block" : "none";
    document.getElementById("modeTable").style.display = mode === "table" ? "block" : "none";
    document.getElementById("modeWorkshop").style.display = mode === "workshop" ? "block" : "none";
  }

  function renderFlowerQuickPick() {
    const keyword = document.getElementById("flowerSearchInput").value.trim().toLowerCase();
    const container = document.getElementById("flowerQuickPick");
    const allFlowers = getAllFlowerNames(galleryData);
    if (allFlowers.length === 0) {
      container.innerHTML = `<div class="empty-state-small">暂无数据</div>`;
      return;
    }
    const matched = keyword ? allFlowers.filter(f => f.toLowerCase().includes(keyword)) : allFlowers;
    matched.sort((a, b) => getOwnersOfFlower(galleryData, b).length - getOwnersOfFlower(galleryData, a).length);
    if (matched.length === 0) {
      container.innerHTML = `<div class="empty-state-small">没有匹配的花卉</div>`;
      return;
    }
    container.innerHTML = `
      <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">
        ${keyword ? `匹配 ${matched.length} 朵` : `共 ${matched.length} 朵`}（点击查看）
      </div>
      <div class="flower-checkbox-grid">
        ${matched.map(f => {
          const c = getOwnersOfFlower(galleryData, f).length;
          return `<button type="button" class="flower-chip" onclick="selectFlower('${escAttr(f)}')">${escHtml(f)} <span style="color:var(--primary); font-weight:700;">${c}</span></button>`;
        }).join("")}
      </div>`;
  }

  function updateFlowerSearchClearBtn() {
    const btn = document.getElementById("flowerSearchClear");
    const inp = document.getElementById("flowerSearchInput");
    if (btn && inp) btn.style.display = inp.value.trim() ? "flex" : "none";
  }

  function clearFlowerSearch() {
    const inp = document.getElementById("flowerSearchInput");
    if (!inp) return;
    inp.value = "";
    onFlowerInput();
    inp.focus();
  }

  function onFlowerInput() {
    updateFlowerSearchClearBtn();
    renderFlowerQuickPick();
    const kw = document.getElementById("flowerSearchInput").value.trim();
    if (galleryData.flowers[kw]) showFlowerResult(kw);
    else if (!kw) document.getElementById("flowerResult").innerHTML = "";
  }

  function selectFlower(flowerName) {
    document.getElementById("flowerSearchInput").value = flowerName;
    updateFlowerSearchClearBtn();
    renderFlowerQuickPick();
    showFlowerResult(flowerName);
  }

  function showFlowerResult(flowerName) {
    const owners = getOwnersOfFlower(galleryData, flowerName);
    const allMembers = getAllMemberIds(galleryData);
    const portUrl = getFlowerPortraitUrlBusted(galleryData, flowerName);
    const thumbHtml = portUrl
      ? `<img class="search-flower-summary-thumb" src="${escAttr(portUrl)}" alt="" loading="lazy">`
      : `<span class="search-flower-summary-thumb-placeholder">无图</span>`;
    document.getElementById("flowerResult").innerHTML = `
      <div class="card search-flower-result-card">
        <div class="card-title search-flower-result-heading">
          <span class="search-flower-result-thumb">${thumbHtml}</span>
          <span class="search-flower-result-name"><span class="icon">🌸</span> ${escHtml(flowerName)}</span>
        </div>
        <div class="result-summary search-flower-stats-bar">
          <div class="result-stat"><div class="result-stat-num" style="color:var(--success);">${owners.length}</div><div class="result-stat-label">拥有人数</div></div>
          <div class="result-stat"><div class="result-stat-num" style="color:var(--primary);">${allMembers.length}</div><div class="result-stat-label">在库成员</div></div>
        </div>
        <div class="search-flower-owners-block">
          <div class="result-section-title"><span class="badge badge-success">${owners.length}</span> 拥有此花</div>
          <div class="result-list">
            ${owners.length ? owners.map(m => `<span class="member-tag" title="${escAttr(m)}">${escHtml(formatMemberLabel(galleryData, m))}</span>`).join("") : '<div class="empty-state-small">无</div>'}
          </div>
        </div>
      </div>`;
  }

  function renderMemberQuickPick() {
    const keyword = document.getElementById("memberSearchInput").value.trim().toLowerCase();
    const container = document.getElementById("memberQuickPick");
    const allMembers = getAllMemberIds(galleryData);
    if (allMembers.length === 0) {
      container.innerHTML = `<div class="empty-state-small">暂无成员</div>`;
      return;
    }
    const matched = keyword ? allMembers.filter(m => memberMatchesKeyword(galleryData, m, keyword)) : allMembers;
    if (matched.length === 0) {
      container.innerHTML = `<div class="empty-state-small">没有匹配的成员</div>`;
      return;
    }
    container.innerHTML = `
      <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">${keyword ? "匹配成员" : "全部成员"}（点击查看）</div>
      <div class="flower-checkbox-grid">
        ${matched.map(m => {
          const c = getFlowersOfMember(galleryData, m).length + getWorkshopFlowersOfMember(galleryData, m).length;
          return `<button type="button" class="flower-chip" onclick="selectMember('${escAttr(m)}')">${escHtml(formatMemberLabel(galleryData, m))} <span style="color:var(--primary); font-weight:700;">${c}</span></button>`;
        }).join("")}
      </div>`;
  }

  function updateMemberSearchClearBtn() {
    const btn = document.getElementById("memberSearchClear");
    const inp = document.getElementById("memberSearchInput");
    if (btn && inp) btn.style.display = inp.value.trim() ? "flex" : "none";
  }

  function clearMemberSearch() {
    const inp = document.getElementById("memberSearchInput");
    if (!inp) return;
    inp.value = "";
    onMemberInput();
    inp.focus();
  }

  function onMemberInput() {
    updateMemberSearchClearBtn();
    renderMemberQuickPick();
    const kw = document.getElementById("memberSearchInput").value.trim();
    if (kw && getAllMemberIds(galleryData).includes(kw)) showMemberResult(kw);
    else if (!kw) document.getElementById("memberResult").innerHTML = "";
  }

  function selectMember(memberId) {
    document.getElementById("memberSearchInput").value = memberId;
    updateMemberSearchClearBtn();
    renderMemberQuickPick();
    showMemberResult(memberId);
  }

  function showMemberResult(memberId) {
    const flowers = getFlowersOfMember(galleryData, memberId);
    const workshop = getWorkshopFlowersOfMember(galleryData, memberId);
    const allFlowers = getAllFlowerNames(galleryData);
    document.getElementById("memberResult").innerHTML = `
      <div class="card">
        <div class="card-title"><span class="icon">👤</span> ${escHtml(formatMemberLabel(galleryData, memberId))}</div>
        <div class="result-summary">
          <div class="result-stat"><div class="result-stat-num" style="color:var(--success);">${flowers.length}</div><div class="result-stat-label">拥有记录花名种数</div></div>
          <div class="result-stat"><div class="result-stat-num" style="color:var(--success);">${workshop.length}</div><div class="result-stat-label">其中在花坊图鉴内</div></div>
          <div class="result-stat"><div class="result-stat-num" style="color:var(--primary);">${allFlowers.length}</div><div class="result-stat-label">本会花名总数</div></div>
        </div>
        <div style="margin-top:20px;">
          <div class="result-section-title"><span class="badge badge-success">${flowers.length}</span> 拥有记录中的花名</div>
          <div class="result-list">
            ${flowers.length ? flowers.map(f => `<span class="flower-pill">${escHtml(f)}</span>`).join("") : '<div class="empty-state-small">无</div>'}
          </div>
        </div>
        <div style="margin-top:20px;">
          <div class="result-section-title"><span class="badge badge-success">${workshop.length}</span> 其中在花坊图鉴内</div>
          <div class="result-list">
            ${workshop.length ? workshop.map(f => `<span class="flower-pill">${escHtml(f)}</span>`).join("") : '<div class="empty-state-small">无</div>'}
          </div>
        </div>
      </div>`;
  }

  function updateTableSearchClearBtn() {
    const btn = document.getElementById("tableSearchClear");
    const inp = document.getElementById("tableSearch");
    if (btn && inp) btn.style.display = inp.value.trim() ? "flex" : "none";
  }

  function clearTableSearch() {
    const inp = document.getElementById("tableSearch");
    if (!inp) return;
    inp.value = "";
    onTableSearchInput();
    inp.focus();
  }

  function onTableSearchInput() {
    updateTableSearchClearBtn();
    renderTable();
  }

  function renderTable() {
    updateTableSearchClearBtn();
    const data = galleryData;
    const keyword = document.getElementById("tableSearch").value.trim().toLowerCase();
    let members = getAllMemberIds(data);
    if (keyword) {
      members = members.filter(m => {
        if (memberMatchesKeyword(data, m, keyword)) return true;
        return getFlowersOfMember(data, m).some(f => f.toLowerCase().includes(keyword));
      });
    }
    members.sort((a, b) => {
      const ca = getFlowersOfMember(data, a).length;
      const cb = getFlowersOfMember(data, b).length;
      if (ca !== cb) return ca - cb;
      return formatMemberLabel(data, a).localeCompare(formatMemberLabel(data, b), "zh-CN");
    });
    const container = document.getElementById("tableContent");
    if (members.length === 0) {
      const total = getAllMemberIds(data).length;
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">🌱</div><div class="empty-title">${total === 0 ? "暂无成员" : "没有匹配项"}</div></div>`;
      return;
    }
    container.innerHTML = `
      <div class="table-wrapper">
        <table class="data-table">
          <thead><tr><th>成员</th><th>花数</th><th style="text-align:left;">拥有的花</th></tr></thead>
          <tbody>
            ${members.map(m => {
              const flowers = getFlowersOfMember(data, m).sort((a, b) => a.localeCompare(b, "zh-CN"));
              return `
              <tr>
                <td><strong>${escHtml(formatMemberLabel(data, m))}</strong></td>
                <td><span class="badge badge-count">${flowers.length}</span></td>
                <td style="text-align:left;">
                  ${flowers.length
                    ? flowers.map(f => `<span class="flower-pill">${escHtml(f)}</span>`).join("")
                    : '<span style="color:#ccc; font-size:12px;">无</span>'}
                </td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>`;
  }

  function updateWorkshopTableSearchClearBtn() {
    const btn = document.getElementById("workshopTableSearchClear");
    const inp = document.getElementById("workshopTableSearch");
    if (btn && inp) btn.style.display = inp.value.trim() ? "flex" : "none";
  }

  function clearWorkshopTableSearch() {
    const inp = document.getElementById("workshopTableSearch");
    if (!inp) return;
    inp.value = "";
    onWorkshopTableSearchInput();
    inp.focus();
  }

  function onWorkshopTableSearchInput() {
    updateWorkshopTableSearchClearBtn();
    renderWorkshopTable();
  }

  function renderWorkshopTable() {
    updateWorkshopTableSearchClearBtn();
    const data = galleryData;
    const flowers = data.flowers || {};
    const catalog = getWorkshopCatalogNames(data);
    const keyword = document.getElementById("workshopTableSearch").value.trim().toLowerCase();
    let rows = catalog.map(name => [name, flowers[name] || []]);
    rows = rows.filter(([name, owners]) => {
      if (!keyword) return true;
      if (name.toLowerCase().includes(keyword)) return true;
      return (owners || []).some(o => memberMatchesKeyword(data, o, keyword));
    });
    rows.sort((a, b) => {
      const d = (a[1] || []).length - (b[1] || []).length;
      return d !== 0 ? d : a[0].localeCompare(b[0], "zh-CN");
    });
    const container = document.getElementById("workshopTableContent");
    if (rows.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">🌱</div><div class="empty-title">${catalog.length === 0 ? "图鉴为空" : "没有匹配项"}</div></div>`;
      return;
    }
    container.innerHTML = `
      <div class="table-wrapper">
        <table class="data-table">
          <thead><tr><th style="width:56px;">图</th><th>图鉴花名</th><th>拥有人数</th><th style="text-align:left;">拥有者<span class="th-subhint">角标 = 未列入本图鉴的花名种数</span></th></tr></thead>
          <tbody>
            ${rows.map(([name, owners]) => {
              const imgu = getFlowerPortraitUrlBusted(data, name);
              const thumb = imgu
                ? `<img class="workshop-row-thumb" src="${escAttr(imgu)}" alt="" loading="lazy">`
                : `<span class="workshop-row-thumb-placeholder">—</span>`;
              return `<tr>
                <td>${thumb}</td>
                <td><strong>${escHtml(name)}</strong></td>
                <td><span class="badge badge-count">${(owners || []).length}</span></td>
                <td style="text-align:left;">
                  ${(owners || []).length ? (owners || []).map(o => {
                    const n = getNonWorkshopFlowerKindCount(data, o);
                    const totalKinds = getFlowersOfMember(data, o).length;
                    const tip = n == null ? "" : `该成员在数据中有 ${totalKinds} 种花名有拥有记录，其中 ${n} 种未列入花坊图鉴子集；数字越小，越偏花坊类任务参考。`;
                    const badge = n == null ? "" : `<span class="member-tag-extracount" title="${escAttr(tip)}">${n}</span>`;
                    return `<span class="member-tag" title="${escAttr(o)}">${escHtml(formatMemberLabel(data, o))}${badge}</span>`;
                  }).join("") : "—"}
                </td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>`;
  }

  init();
</script>
</body>
</html>
